<style>
:root{--p:#0a74c4;--pd:#0b4f8a;--o:#f59e0b;--r:#e11d48;--g:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;overflow-wrap:anywhere;font:15px/1.5 system-ui,Arial,sans-serif;color:#0f172a;min-height:100vh;background:linear-gradient(160deg,#e0f2fe,#fefce8 55%,#ffedd5) fixed}
.top{background:linear-gradient(90deg,#0b4f8a,#0a74c4 60%,#0ea5e9);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:4px solid var(--o);position:sticky;top:0;z-index:5}
.lg{display:flex;align-items:center;gap:10px}.lg img{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid #fff}
.lg b{font-size:16px}.lg small{display:block;opacity:.92;font-size:12px}
.rt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;text-align:right}
main{padding:12px;max-width:1150px;margin:auto}
@supports(padding:max(0px)){.top{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:max(12px,env(safe-area-inset-bottom))}}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0a74c422;border-top:4px solid #38bdf8}
.card h2,.card h3,.card h4{color:var(--pd);margin:.2em 0 .5em}
.nb{display:inline-block;background:var(--o);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-size:14px;margin-right:6px}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 2px;color:var(--pd)}
input,select,textarea{width:100%;max-width:100%;-webkit-appearance:none;appearance:none;padding:9px;border:1px solid #7dd3fc;border-radius:10px;font:inherit;background:#fff}
input[type=file]{-webkit-appearance:auto;appearance:auto}select{background-image:linear-gradient(45deg,transparent 50%,#0b4f8a 50%),linear-gradient(135deg,#0b4f8a 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}input[readonly]{background:#f1f5f9}input:focus,select:focus,textarea:focus{outline:2px solid #38bdf8}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 12px}
button,.bt{border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;font-family:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;color:#fff;background:linear-gradient(90deg,#0a74c4,#0ea5e9);margin:3px 3px 3px 0}
button.g{background:linear-gradient(90deg,#64748b,#94a3b8)}button.r{background:linear-gradient(90deg,#e11d48,#fb7185)}button.x{background:linear-gradient(90deg,#16a34a,#22c55e)}button.o{background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#1f2937}
button.big{padding:12px 22px;font-size:16px}button:disabled{opacity:.5;cursor:not-allowed}
button.sm{padding:4px 9px;font-size:12px}button.on{box-shadow:0 0 0 3px #fcd34d}
.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 2px}.tabs button{white-space:nowrap;background:#e0f2fe;color:var(--pd)}.tabs button.on{background:linear-gradient(90deg,#0a74c4,#0ea5e9);color:#fff;box-shadow:0 2px 6px #0a74c455}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:620px}th,td{border:1px solid #bae6fd;padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}th{background:#e0f2fe;color:var(--pd)}tr:nth-child(even) td{background:#f8fcff}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:8px 0}
.sc{border:2px solid #bae6fd;border-radius:12px;padding:10px;cursor:pointer;background:#fff}.sc:hover{border-color:#38bdf8}.sc.on{border-color:var(--o);background:#fffbeb;box-shadow:0 0 0 3px #fde68a}
.sc .ab{display:inline-block;background:var(--pd);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}.sc h4{margin:6px 0 2px}.sc small{color:#475569}
.ok{background:#dcfce7;border:1px solid #86efac;color:#166534;border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:13px}
.warn{background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;padding:8px 12px;margin:10px auto;max-width:1126px;font-size:14px}
.bar{background:#e0f2fe;border-radius:6px;height:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0a74c4,#f59e0b)}
.qg{display:block}.qw{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}.qw>*,.card,.op>span{min-width:0}.op>span{overflow-wrap:anywhere}@media(max-width:800px){.qw{grid-template-columns:minmax(0,1fr)}}
.qn{color:var(--p);font-weight:700}.qt{font-size:17px;margin:8px 0 12px}
.op{border:2px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;display:flex;gap:8px}.op:hover{border-color:#7dd3fc}.op.on{border-color:var(--p);background:#e0f2fe}
.op.good{border-color:#22c55e;background:#dcfce7}.op.bad{border-color:#f43f5e;background:#ffe4e6}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-bottom:10px}.pb{margin:0;padding:8px 0;background:#e2e8f0;color:#0f172a}.pb.ans{background:linear-gradient(90deg,#16a34a,#22c55e);color:#fff}.pb.cur{box-shadow:0 0 0 3px var(--o)}
.tm{font-size:22px;font-weight:700;background:#0003;border-radius:10px;padding:2px 12px}

.sco div:nth-child(1){background:linear-gradient(135deg,#0a74c4,#38bdf8)}.sco div:nth-child(2){background:linear-gradient(135deg,#16a34a,#4ade80)}.sco div:nth-child(3){background:linear-gradient(135deg,#f59e0b,#fbbf24)}.sco div:nth-child(4){background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.bd{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600}.bd.d{background:#fef3c7;color:#92400e}.bd.n{background:#dcfce7;color:#166534}
.login{max-width:410px;margin:4vh auto;padding:0 14px}.login .card{text-align:center;padding:0 18px 18px;border-top:0;overflow:hidden}
.login .hd{background:linear-gradient(180deg,#e0f2fe,#fff);margin:0 -18px 8px;padding:12px}.login .hd img{width:96px;height:96px;border-radius:50%}
.login h2{margin:4px 0;font-size:21px}.login label,.login input{text-align:left}.pw{position:relative}.pw input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;color:#000;font-size:19px;padding:4px 8px;margin:0}
.ld{text-align:center;padding:12vh 20px}.ld img{width:90px;border-radius:50%}

.qi{border:1px solid #bae6fd;border-radius:10px;padding:10px;margin:8px 0;background:#fff}.qi .o{padding-left:10px;font-size:14px}.qi .c{color:#15803d;font-weight:700}

function sha256js(str){const u=unescape(encodeURIComponent(str)),b=[];for(let i=0;i<u.length;i++)b.push(u.charCodeAt(i));
 const K=[];for(let n=2,c=0;c<64;n++){let p=1;for(let d=2;d*d<=n;d++)if(n%d==0){p=0;break}if(p){K.push(Math.floor((Math.pow(n,1/3)%1)*4294967296)>>>0);c++}}
 const H=[];for(let n=2,c=0;c<8;n++){let p=1;for(let d=2;d*d<=n;d++)if(n%d==0){p=0;break}if(p){H.push(Math.floor((Math.pow(n,.5)%1)*4294967296)>>>0);c++}}
 const L=b.length*8;b.push(128);while(b.length%64!=56)b.push(0);const hi=Math.floor(L/4294967296),lo=L>>>0;
 b.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,(lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
 const R=(x,n)=>(x>>>n)|(x<<(32-n));
 for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=((b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3])>>>0;
  for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
  let [a,bb,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])>>>0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=bb;bb=a;a=(t1+t2)>>>0}
  H[0]=(H[0]+a)>>>0;H[1]=(H[1]+bb)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0}
 return H.map(x=>("00000000"+x.toString(16)).slice(-8)).join("")}

// Chuyển dữ liệu định dạng cũ (teacherList/studentList/questionBank/subjectConfigs/submissions) sang định dạng mới
async function fromLegacy(d){
 const acc=async(x,t)=>{const u=String(x.username).trim().toLowerCase(),pw=String(x.password==null?DEF:x.password),def=x.isDefaultPassword===undefined?pw==DEF:!!x.isDefaultPassword||pw==DEF;
  const o={u,name:x.fullName,h:await hp(u,pw),def:def?1:0};if(def)o.dp=pw;return o};
 const teachers=[];for(const t of d.teacherList||[]){const o=await acc(t);o.sub=t.subjectId||"toan";o.role=o.u=="admin"?"admin":"gv";teachers.push(o)}
 const students=[];for(const s of d.studentList||[]){const o=await acc(s);o.cls=String(s.className||"").toUpperCase();students.push(o)}
 const cfg=d.subjectConfigs||{};
 const subjects=SUBINFO.map(([id,name,ab])=>({id,name,ab,title:(cfg[id]||{}).title||("Bài tập "+name),gv:(cfg[id]||{}).teacherName||"",min:(cfg[id]||{}).duration||15}));
 const qs=(d.questionBank||[]).map((q,i)=>({id:q.id||("q"+i),sub:q.subject,q:q.question,o:[q.optA,q.optB,q.optC,q.optD],a:Math.max(0,"ABCD".indexOf(String(q.answer).toUpperCase())),ex:q.explanation||""}));
 const R=(d.submissions||[]).map((x,i)=>{const p=String(x.submittedAt||"").match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):?(\d+)?/),tm=String(x.timeSpent||"0:0").split(":");
  return{id:"old"+(x.id||i),u:x.studentId,name:x.name,cls:x.className,sub:x.subjectId,subName:x.subjectName,gv:x.teacherName,title:x.assignmentTitle,ok:x.correctCount,tot:x.total,score:+x.score,ts:p?new Date(+p[3],+p[2]-1,+p[1],+p[4],+p[5],+(p[6]||0)).getTime():Date.now(),dur:((+tm[0]||0)*60+(+tm[1]||0))*1000,det:x.answerDetails||""}});
 return{A:{teachers,students},B:{subjects,qs},R}}

function initFB(){
 try{if(typeof firebase==="undefined")throw new Error("Không tải được thư viện Firebase (kiểm tra mạng hoặc trình chặn quảng cáo)");
  if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore();
  try{db.settings({experimentalForceLongPolling:true,experimentalAutoDetectLongPolling:false,useFetchStreams:false})}catch(e){}   // giúp điện thoại/4G/Wi-Fi trường kết nối ổn định
  rA=db.collection("kttt").doc("accounts");rB=db.collection("kttt").doc("bank")}
 catch(e){db=null;rA=null;rB=null;syncS="Lỗi kết nối: "+e.message;ui();return}
 const ready={A:false,B:false};
 const on=(ref,key,sf)=>ref.onSnapshot(s=>{try{if(s.exists){const d=JSON.parse(s.data().s);if(key=="A"){if(!Array.isArray(d.students)||!Array.isArray(d.teachers))throw Error("Dữ liệu tài khoản không hợp lệ");A=d}else{if(!Array.isArray(d.subjects)||!Array.isArray(d.qs))throw Error("Dữ liệu đề chưa đầy đủ");B=d}ready[key]=true;loc();syncS=ready.A&&ready.B?"ok":"Đang tải dữ liệu…";ui()}else ensure(ref,sf)}catch(e){syncS="Lỗi đọc dữ liệu: "+e.message;ui()}},e=>{syncS="Lỗi: "+e.message;ui()});
 on(rA,"A",seedA);on(rB,"B",seedB)}
async function localBoot(){if(!A)A=await seedA();if(!B)B=await seedB();loc();ui()}
async function ensure(ref,f){try{const d=await f();await db.runTransaction(async t=>{const s=await t.get(ref);if(!s.exists)t.set(ref,{s:JSON.stringify(d),t:Date.now()})})}catch(e){syncS="Lỗi khởi tạo: "+e.message;ui()}}
async function mut(w,fn){const ref=w=="A"?rA:rB;
 if(!ref){const d=w=="A"?A:B;fn(d);loc();ui();return}
 try{const r=await db.runTransaction(async t=>{const s=await t.get(ref);const d=s.exists?JSON.parse(s.data().s):(w=="A"?A:B);fn(d);t.set(ref,{s:JSON.stringify(d),t:Date.now()});return d});
  if(w=="A")A=r;else B=r;loc();ui()}catch(e){toast("Không lưu được lên máy chủ: "+e.message,1);throw e}}

function myResults(sub,ex){if(!me||me.kind!="s")return[];const seen=new Set();return [...MINE,...R,...PEND,...(LAST&&!LAST.trial?[LAST.rec]:[])].filter(r=>{if(!r||r.u!==me.u||r.sub!==sub||(ex&&r.examId!==ex)||seen.has(r.id))return false;seen.add(r.id);return true}).sort((a,b)=>(+b.ts||0)-(+a.ts||0))}

function encodeChunks(ab){const bytes=new Uint8Array(ab),out=[];for(let i=0;i<bytes.length;i+=EXAM_CHUNK){let str="";const part=bytes.subarray(i,i+EXAM_CHUNK);for(let j=0;j<part.length;j+=8192)str+=String.fromCharCode(...part.subarray(j,j+8192));out.push(btoa(str))}return out}
function bankJSON(d){const text=JSON.stringify(d);if(new TextEncoder().encode(text).length>900000)throw Error("Ngân hàng đã gần đầy. Vui lòng sao lưu và xóa bớt đề cũ trước khi thêm.");return text}
function validChunks(meta,chunks){if(!Array.isArray(chunks)||chunks.length!==meta.chunks||!chunks.length||chunks.length>40)throw Error("Tệp đính kèm chưa đầy đủ");const parts=chunks.map(t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0)));if(parts.reduce((n,p)=>n+p.length,0)!==meta.size)throw Error("Dung lượng tệp đính kèm không khớp");return parts}

function togCls(el){const c=el.dataset.c,i=GC.indexOf(c);if(i>=0)GC.splice(i,1);else GC.push(c);el.querySelector(".ci").classList.toggle("on");calcG()}

function calcG(){const e=$("#g_i");if(!e)return;const cn=$("#g_cn");if(cn)cn.textContent=`(đã chọn ${GC.length}/${clsAll().length} lớp)`;
 const subject=B.subjects.find(s=>s.id===GS),avail=questionPool(subject,($("#g_exam")||{}).value||"").length,n0=Math.max(0,Math.floor(+$("#g_n").value||0)),N=n0>0?Math.min(n0,avail):avail,p=+$("#g_p").value||0,per=N?Math.round(10/N*10000)/10000:0;
 $("#g_n").max=avail;const f3h=f3Note(subject,p,n0);if(f3h){e.innerHTML=f3h;qpSum();return}e.innerHTML=(p>0?`Mỗi đề gồm <b>${N}</b> câu × <b>${p}</b> điểm = <b>${fx(N*p)}</b> điểm tối đa → kết quả được quy đổi về <b>thang điểm 10</b>.`:`Mỗi đề gồm <b>${N}</b> câu, hệ thống tự chia đều 10 điểm: mỗi câu = <b>${fx(per)}</b> điểm.`)+(n0>avail?` <b style="color:#be123c">(Vượt số câu hiện có)</b>`:"")+` <button class="o sm" type="button" onclick="$('#g_p').value=${per};calcG()">Tự tính 10 ÷ ${N} câu</button>`+($("#g_qm")&&$("#g_qm").checked?" <b>Đang bật cho điểm riêng từng câu</b>: câu không nhập điểm dùng điểm mặc định.":"");qpSum()}
const vn=n=>String(Math.round(n*100)/100).replace(".",",");
function f3Note(subject,p,n0){const exId=($("#g_exam")||{}).value||"",exo=exId?examOf(exId):null;if(!exo||exo.fmt!==3)return"";if($("#g_qm")&&$("#g_qm").checked)return"";
 const pool=questionPool(subject,exId),n1=pool.filter(q=>!isTF(q)&&!isNum(q)).length,n2=pool.filter(isTF).length,n3=pool.filter(isNum).length,a=n1*.25,b=n2,c=n3*.25,t=a+b+c;
 return`<b>Đề định dạng 3 phần — hệ thống tự chấm điểm:</b><br>• Phần I: ${n1} câu × 0,25 = <b>${vn(a)}</b> điểm<br>• Phần II (Đúng/Sai): ${n2} câu, mỗi câu tối đa 1 điểm (đúng 1 ý: 0,1 • 2 ý: 0,25 • 3 ý: 0,5 • 4 ý: 1) = <b>${vn(b)}</b> điểm<br>• Phần III: ${n3} câu × 0,25 = <b>${vn(c)}</b> điểm<br>Tổng = <b>${vn(t)}</b> điểm${Math.abs(t-10)>1e-9?" → quy đổi về <b>thang điểm 10</b>":""}. Đề 3 phần luôn dùng toàn bộ câu hỏi của đề; các ô “Số câu mỗi đề” và “Số điểm mỗi câu” được bỏ qua. Muốn chấm theo cách khác: bật “Cho điểm thủ công từng câu”.`}

function renderQP(){const w=$("#g_qp");if(!w)return;const s=B.subjects.find(x=>x.id===GS);if(!s)return;const ex=($("#g_exam")||{}).value||"",qs=questionPool(s,ex),m=s.qpts||{};
 if(!qs.length){w.innerHTML="<i>Chưa có câu hỏi để cho điểm. Hãy chọn một đề đã tải lên ở mục “Chọn đề để giao bài”.</i>";return}
 const nm=qs.filter(isMulti).length,nt=qs.filter(isTF).length;
 w.innerHTML=`<div class="f"><div><label>Đặt cùng một số điểm cho tất cả các câu</label><div style="display:flex;gap:6px"><input id="qp_all" type="number" min="0" max="100" step="0.05" placeholder="VD: 0.5"><button class="g sm" type="button" onclick="qpAll()">Áp dụng</button><button class="g sm" type="button" onclick="qpClr()">Xóa hết</button></div></div></div>${nm?`<p><small>Đề có <b>${nm}</b> câu nhiều đáp án đúng: nhập điểm cho <b>từng đáp án đúng</b> của câu đó (điểm câu = tổng các đáp án). Học sinh chọn đúng đáp án nào được điểm đáp án đó; chọn sai bất kỳ đáp án nào thì câu đó 0 điểm.</small></p>`:""}${nt?`<p><small>Đề có <b>${nt}</b> câu Đúng/Sai: nhập điểm cho <b>từng ý A, B, C, D</b> (điểm câu = tổng các ý). Học sinh chọn đúng Đ/S ở ý nào được điểm của ý đó; chọn không đúng thì ý đó không được điểm. Ô để trống dùng điểm mặc định chia đều cho các ý.</small></p>`:""}<p id="qp_sum"></p><div style="max-height:60vh;overflow:auto">`+qs.map((q,i)=>{const c=isTF(q)?q.tf.map((_,k)=>k):caOf(q),mu=isPart(q),v=m[q.id];
  const left=isTF(q)?`Đáp án Đúng/Sai:`+q.o.map((o,k)=>`<div><b>${"ABCD"[k]}.</b> ${ro(q,k)} → <u><b>${q.tf[k]?"Đ (Đúng)":"S (Sai)"}</b></u></div>`).join(""):mu?`Các đáp án đúng (${c.length}):`+c.map(k=>`<div><u><b>${"ABCD"[k]}.</b> ${ro(q,k)}</u></div>`).join(""):isNum(q)?`Đáp án (điền số): <u><b>${esc(q.nums.join(" hoặc "))}</b></u>`:`Đáp án đúng: <u><b>${"ABCD"[q.a]}.</b> ${ro(q,q.a)}</u>`;
  const right=mu?c.map((k,j)=>`<label style="font-size:12px">Điểm đáp án ${"ABCD"[k]}</label><input class="qp_m" data-id="${esc(q.id)}" data-k="${j}" type="number" min="0" max="100" step="0.05" value="${Array.isArray(v)&&v[j]!=null?v[j]:""}" placeholder="mặc định" oninput="qpSum()">`).join(""):`<label style="font-size:12px">Điểm câu ${i+1}</label><input class="qp_i" data-id="${esc(q.id)}" type="number" min="0" max="100" step="0.05" value="${v!=null&&!Array.isArray(v)?v:""}" placeholder="mặc định" oninput="qpSum()">`;
  return`<div class="qi" style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1;min-width:0"><b>Câu ${i+1}.</b> ${rq(q)}<div style="margin-top:4px">${left}</div></div><div style="width:110px;flex:none">${right}</div></div>`}).join("")+`</div>`;
 mathAll(w);qpSum()}
function qpSum(){const e=$("#qp_sum");if(!e)return;const ins=[...document.querySelectorAll(".qp_i")],mi=[...document.querySelectorAll(".qp_m")],ids=[...new Set(mi.map(i=>i.dataset.id))],N=ins.length+ids.length,p=+(($("#g_p")||{}).value)||0,base=p>0?p:(N?Math.round(10/N*10000)/10000:0);let tot=0,c=0;
 ins.forEach(i=>{if(i.value!==""&&+i.value>=0){tot+=+i.value;c++}else tot+=base});
 ids.forEach(id=>{const g=mi.filter(i=>i.dataset.id==id);let any=false;g.forEach(i=>{if(i.value!==""&&+i.value>=0){tot+=+i.value;any=true}else tot+=base/g.length});if(any)c++});
 e.innerHTML=`Đã nhập điểm riêng cho <b>${c}/${N}</b> câu • Tổng điểm tối đa (nếu dùng đủ ${N} câu): <b>${fx(tot)}</b> (câu/đáp án để trống tính mặc định ${fx(base)} điểm/câu) → quy đổi về <b>thang điểm 10</b>.`}
function qpAll(){const v=$("#qp_all").value;if(v===""||!(+v>=0&&+v<=100))return toast("Nhập số điểm từ 0 đến 100","e");document.querySelectorAll(".qp_i").forEach(i=>i.value=v);
 const g={};document.querySelectorAll(".qp_m").forEach(i=>(g[i.dataset.id]=g[i.dataset.id]||[]).push(i));Object.values(g).forEach(a=>a.forEach(i=>i.value=Math.round(+v/a.length*10000)/10000));qpSum()}

async function saveSub(){if(!canSub(GS))return toast("Bạn không có quyền với môn này","e");const g=$("#g_g").value,m=Math.max(1,Math.min(300,+$("#g_m").value||15)),n=Math.max(0,Math.floor(+$("#g_n").value||0)),p=Math.max(0,+$("#g_p").value||0),dv=$("#g_d").value,due=dv?new Date(dv).getTime():0,ov=$("#g_o")?$("#g_o").value:"",open=ov?new Date(ov).getTime():0,examId=$("#g_exam").value,avail=questionPool(B.subjects.find(s=>s.id===GS),examId).length;
 if(examId&&!exams().some(e=>e.id===examId&&e.sub===GS))return toast("Hãy chọn một đề kiểm tra còn tồn tại","e");
 if(p>10)return toast("Số điểm mỗi câu không hợp lệ (tối đa 10)","e");if(n>avail)return toast(`Ngân hàng môn này chỉ có ${avail} câu`,"e");if(dv&&isNaN(due))return toast("Thời hạn không hợp lệ","e");if(ov&&isNaN(open))return toast("Giờ mở khóa không hợp lệ","e");if(open&&due&&due<=open)return toast("Thời hạn truy cập phải sau giờ mở khóa","e");
 const shuf=$("#g_h")&&$("#g_h").value==="0"?0:1,qm=!!($("#g_qm")&&$("#g_qm").checked),allowRetry=!!($("#g_retry")&&$("#g_retry").checked),showResult=!!($("#g_result")&&$("#g_result").checked),sNow=B.subjects.find(x=>x.id===GS)||{},qpts=Object.assign({},sNow.qpts||{});let badQ=false;
 document.querySelectorAll(".qp_i").forEach(i=>{const v=i.value.trim();if(v===""){delete qpts[i.dataset.id]}else{const x=+v;if(!(x>=0&&x<=100))badQ=true;else qpts[i.dataset.id]=Math.round(x*10000)/10000}});
 const grp={};document.querySelectorAll(".qp_m").forEach(i=>{(grp[i.dataset.id]=grp[i.dataset.id]||[])[+i.dataset.k]=i.value.trim()});
 Object.keys(grp).forEach(id=>{const arr=Array.from(grp[id],v=>v===undefined?"":v);if(arr.every(v=>v===""))delete qpts[id];else qpts[id]=arr.map(v=>{if(v==="")return null;const x=+v;if(!(x>=0&&x<=100)){badQ=true;return null}return Math.round(x*10000)/10000})});
 if(badQ)return toast("Điểm từng câu / từng đáp án phải từ 0 đến 100","e");
 await mut("B",d=>{const s=d.subjects.find(x=>x.id==GS);Object.assign(s,{gv:g,min:m,n,pt:p,due,cls:GC.slice(),examId,qm,qpts,shuf,open,allowRetry,showResult})});toast("Đã lưu cài đặt giao bài")}
function helpDoc(){modal(`<h3>Hướng Dẫn Định Dạng Đề Trắc Nghiệm Trên Word (.docx)</h3><p>Cấu trúc chuẩn khi soạn câu hỏi trên file Word:</p><pre style="background:#f1f5f9;padding:10px;border-radius:8px;white-space:pre-wrap">Câu 1: Môn Địa lí được học ở
<u>A.</u> tất cả các cấp học phổ thông.
B. cấp trung học, chuyên nghiệp.
C. cấp tiểu học, trung học cơ sở.
D. tất cả các môn học ở tiểu học.</pre><p><b>Cách 1 (khuyên dùng):</b> gạch chân đáp án đúng (gạch chân chữ “A.” hoặc cả nội dung đáp án). Câu có một đáp án đúng thì gạch chân <b>một</b> đáp án. Câu có <b>nhiều đáp án đúng</b>: gạch chân <b>tất cả</b> các đáp án đúng (tối đa 4 đáp án).<br><b>Cách 2:</b> thêm dòng <code>Đáp án: B</code> (nhiều đáp án: <code>Đáp án: A, C</code> hoặc <code>Đáp án: AC</code>) (nếu có cả gạch chân và dòng đáp án, hai cách đánh dấu phải khớp nhau). Có thể thêm dòng <code>Lời giải: ...</code>.<br>Các đáp án có thể nằm cùng một dòng hoặc trong bảng 2 cột như ảnh mẫu.</p><p><b>Câu điền số</b> (học sinh tự nhập đáp án là số): không ghi các đáp án A–D, chỉ thêm dòng đáp án số:</p><pre style="background:#f1f5f9;padding:10px;border-radius:8px;white-space:pre-wrap">Câu 7: Tính 2 × 7.
Đáp án: 14
Lời giải: 2 × 7 = 14.

Câu 8: Có hai giá trị thỏa mãn, tìm giá trị đó.
Đáp án: 14 hoặc 23</pre><p>Học sinh điền <b>14 hoặc 23</b> đều được tính đúng. Dùng “hoặc” hoặc dấu ; để ngăn cách các đáp án được chấp nhận; số thập phân viết 2,5 hoặc 2.5 đều được. Có thể trộn câu trắc nghiệm và câu điền số trong cùng một đề.</p><p><b>Câu Đúng/Sai</b> (mỗi câu tối đa 4 ý A–D, học sinh chọn <b>Đ</b> hoặc <b>S</b> cho từng ý): viết các ý A, B, C, D như câu trắc nghiệm (không cần gạch chân), rồi ghi một dòng đáp án cho <b>từng ý</b> theo dạng “Đáp án X (Đúng)” hoặc “Đáp án X (Sai)”:</p><pre style="background:#f1f5f9;padding:10px;border-radius:8px;white-space:pre-wrap">Câu 9: Xét các phát biểu sau về khí hậu nước ta:
